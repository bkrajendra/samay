apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeserver
  namespace: timeserver
  labels:
    app: timeserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: timeserver
  template:
    metadata:
      labels:
        app: timeserver
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      shareProcessNamespace: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      # A fresh emptyDir is created with permissive default permissions,
      # which chronyd refuses to use for its command socket (it requires
      # the directory not be group/world-writable). Fix the permissions
      # here, before either main container starts, rather than granting
      # chronyd or console extra capabilities to do it themselves.
      initContainers:
        - name: init-chrony-run
          image: alpine:3.20
          command: ["sh", "-c", "mkdir -p /run/chrony && chmod 0750 /run/chrony"]
          volumeMounts:
            - name: chrony-run
              mountPath: /run/chrony
      containers:
        - name: chronyd
          image: ghcr.io/bkrajendra/samay:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - SYS_TIME
                - NET_BIND_SERVICE
              drop:
                - ALL
          ports:
            - name: ntp
              containerPort: 123
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/chrony/chrony.conf
              subPath: chrony.conf
            - name: chrony-lib
              mountPath: /var/lib/chrony
            - name: chrony-run
              mountPath: /run/chrony
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: console
          image: ghcr.io/bkrajendra/samay-console:latest
          imagePullPolicy: Always
          # More restricted than chronyd: no SYS_TIME (it never touches the
          # clock itself) and no NET_BIND_SERVICE (its HTTP port is >1024).
          # runAsUser: 0 matches chronyd's UID only so it can signal
          # chronyd's process for the restart action (see internal/chrony's
          # RestartService) — same-UID signaling needs no extra capability.
          securityContext:
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: console-env
          volumeMounts:
            - name: chrony-run
              mountPath: /run/chrony
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: timeserver-config
        - name: chrony-lib
          emptyDir: {}
        - name: chrony-run
          emptyDir: {}
